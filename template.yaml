AWSTemplateFormatVersion: '2010-09-09'
Description: FitTrack Backend Template

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  CognitoUserPoolId:
    Type: String
    Default: us-east-1_FiMxzIAMO
  CognitoClientId:
    Type: String
    Default: 5mqksvmvu33fqsk9e570f22jcf

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fittrack-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fittrack-users
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fittrack-users/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fittrack-plans
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fittrack-logs
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fittrack-logs/index/*
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fittrack/anthropic-api-key*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fittrack/gemini-api-key*
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: S3UploadsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::fittrack-user-uploads/*

  # ── MAIN LAMBDA ─────────────────────────────────────────────
  FitTrackLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub fittrack-backend-lambda-${Environment}
      Runtime: java17
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Code:
        S3Bucket: fittrack-deployments
        S3Key: backend/function.zip
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: us-east-1_FiMxzIAMO
          ENVIRONMENT: !Ref Environment
          APP_ZONE: America/New_York

  # ── EVENTBRIDGE RULE ────────────────────────────────────────
  # Fires daily at 2 AM Eastern (7 AM UTC). The service decides per user whether a new week is due:
  # after the last training day of the week is done (Sat/Sun), or as a Monday catch-up.
  WeeklyPlanScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub fittrack-weekly-plan-rule-${Environment}
      Description: Daily check for users whose next weekly plan is due
      ScheduleExpression: 'cron(0 7 * * ? *)'
      State: ENABLED
      Targets:
        - Id: FitTrackWeeklyPlanTarget
          Arn: !GetAtt FitTrackLambda.Arn
          Input: |
            {
              "version": "2.0",
              "routeKey": "POST /plans/generate-weekly-scheduled",
              "rawPath": "/plans/generate-weekly-scheduled",
              "rawQueryString": "",
              "headers": {
                "content-type": "application/json"
              },
              "requestContext": {
                "http": {
                  "method": "POST",
                  "path": "/plans/generate-weekly-scheduled",
                  "protocol": "HTTP/1.1"
                }
              },
              "body": "{\"source\":\"eventbridge\",\"action\":\"GENERATE_WEEKLY_PLANS\"}",
              "isBase64Encoded": false
            }

  # Permission for EventBridge to invoke Lambda
  WeeklyPlanSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FitTrackLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WeeklyPlanScheduleRule.Arn

  # ── API GATEWAY ─────────────────────────────────────────────
  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub fittrack-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FitTrackLambda.Arn
      PayloadFormatVersion: '2.0'

  # Verifies the Cognito ID token on every route except the public ones below.
  ApiJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApiGateway
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref CognitoClientId
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}

  UsersPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /users'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  UsersGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /users/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  UsersUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /users/update/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  PlansGenerateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /plans/generate'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  PlansGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /plans/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  PlansGenerateWeeklyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /plans/generate-weekly'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  LogsCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /logs/createLog'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  LogsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /logs/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  LogsGetByDateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /logs/{userId}/{date}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  LogsUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /logs/update/{userId}/{date}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  PlansCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /plans/createPlan'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  UsersCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /users/create'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  UsersCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /users/check/{username}'
      Target: !Sub integrations/${LambdaIntegration}

  UsersMeasurementsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /measurements/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  MealTemplatesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /meal-templates/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  MealTemplatesPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /meal-templates/{userId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  NutritionCalculateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /nutrition/calculate'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  PhotoUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /users/photo/upload'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /health'
      Target: !Sub integrations/${LambdaIntegration}

  WeeklyScheduledRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /plans/generate-weekly-scheduled'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiJwtAuthorizer
      Target: !Sub integrations/${LambdaIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: $default
      AutoDeploy: true

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FitTrackLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*

  # ── DYNAMODB TABLES ─────────────────────────────────────────
  FitTrackUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: fittrack-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: username-index
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  FitTrackPlansTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: fittrack-plans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  FitTrackLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: fittrack-logs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - AttributeName: date
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com

  WeeklyPlanScheduleRuleArn:
    Description: EventBridge rule ARN for weekly plan generation
    Value: !GetAtt WeeklyPlanScheduleRule.Arn